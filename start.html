pz.onclick=pause;document.getElementById('sk').onclick=skip;const mu=document.getElementById('mu');mu.onclick=()=>{muted=!muted;mu.textContent=muted?'🔇':'🔊';if(muted){if(SS)SS.cancel();if(ac)ac.suspend()}else if(ac&&!S.paused)ac.resume()};
document.getElementById('again').onclick=()=>location.reload();
addEventListener('keydown',e=>{if(!S.started)return;if(e.code==='Space'){e.preventDefault();pause()}if(e.code==='ArrowRight')skip()});
